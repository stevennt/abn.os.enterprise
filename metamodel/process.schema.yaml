# Process schema (v0.1) — the "flow" primitive
# Router picks process by (event_type + version). Steps are workflow|ai|human.
type: object
required: [id, version, event_type, inputs, steps, outputs, kpis, automation_target]
properties:
  id:       {type: string, example: "loan.retail.unsecured"}
  version:  {type: string, example: "1.3.0"}
  event_type: {type: string, example: "loan.application.submitted"}
  department: {type: string, example: "retail.credit"}
  inputs:   {type: object, example: {schema_ref: "events/loan.application.v1.json"}}
  steps:
    type: array
    items:
      type: object
      required: [id, kind, owner_role, level, on_fail]
      properties:
        id:         {type: string, example: "s2-score"}
        kind:       {type: string, enum: [workflow, ai, human]}
        owner_role: {type: string, example: "credit_officer"}
        level:      {type: string, example: "L3"}
        uses_rule:  {type: array, items: {type: string}, example: ["SBV-DSTI-04"]}
        uses_touchpoint: {type: string, example: "TP-C-app-status"}
        sla_minutes: {type: integer, example: 240}
        on_fail:    {type: string, example: "escalate:credit_manager"}
  outputs:  {type: object, example: {decision: "APPROVE|DECLINE|REVIEW", limit_vnd: 500000000}}
  kpis:
    type: array
    items: {type: string}
    example: ["approval_rate", "default_30d", "tta_p50", "override_rate"]
  automation_target: {type: string, example: "L4"}
