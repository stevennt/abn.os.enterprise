$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/stevennt/abn.os.enterprise/metamodel/org.schema.yaml/v1.0.0"
title: "OrgUnit v1.0.0 — the 'who' primitive"
x-glossary: [OrgUnit, Role, Process]
type: object
required: [id, version, name, roles, headcount_plan]
properties:
  id:             {type: string, minLength: 1, examples: ["retail.credit"]}
  version:        {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$", examples: ["1.0.0"]}
  name:           {type: string, minLength: 1}
  parent_id:      {type: [string, "null"]}
  mandate:        {type: string}
  roles:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, title, raci_scope, approvals]
      properties:
        id:         {type: string}
        title:      {type: string}
        raci_scope: {type: array, items: {type: string}}
        approvals:  {type: array, items: {type: string}}
        headcount:  {type: integer, minimum: 0}
      additionalProperties: true
  headcount_plan: {type: integer, minimum: 0}
  systems_used:   {type: array, items: {type: string}}
additionalProperties: true
