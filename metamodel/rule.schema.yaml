$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/stevennt/abn.os.enterprise/metamodel/rule.schema.yaml/v1.0.0"
title: "Rule v1.0.0 — DMN-style, never embedded in code"
x-glossary: [Rule, Process]
type: object
required: [id, version, authority, inputs, table, effect]
properties:
  id:        {type: string, minLength: 1, examples: ["SBV-DSTI-04"]}
  version:   {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$"}
  authority: {type: string, minLength: 1}
  inputs:    {type: array, items: {type: string}}
  table:
    type: array
    minItems: 1
    items: {type: object}
  effect:    {type: string, minLength: 1}
additionalProperties: true
