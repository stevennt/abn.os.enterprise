$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/stevennt/abn.os.enterprise/metamodel/process.schema.yaml/v1.0.0"
title: "Process v1.0.0 — the 'flow' primitive"
x-glossary: [Process, Event, Level, Touchpoint, Rule, Instance]
type: object
required: [id, version, event_type, inputs, steps, outputs, kpis, automation_target]
properties:
  id:       {type: string, minLength: 1, examples: ["loan.retail.unsecured"]}
  version:  {type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$", examples: ["1.3.0"]}
  event_type: {type: string, minLength: 1}
  department: {type: string}
  inputs:   {type: object}
  steps:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, kind, owner_role, level, on_fail]
      properties:
        id:         {type: string}
        kind:       {type: string, enum: [workflow, ai, human]}
        owner_role: {type: string}
        level:      {type: string, enum: [L0, L1, L2, L3, L4, L5]}
        uses_rule:  {type: array, items: {type: string}}
        uses_touchpoint: {type: string}
        sla_minutes: {type: integer, minimum: 1}
        on_fail:    {type: string}
      additionalProperties: true
  outputs:  {type: object}
  kpis:
    type: array
    minItems: 1
    items: {type: string}
  automation_target: {type: string, enum: [L0, L1, L2, L3, L4, L5]}
additionalProperties: true
