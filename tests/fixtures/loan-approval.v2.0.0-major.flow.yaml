audit: every step emits {step, actor, rule_version, model_version, ts, hash_prev}
automation_target: L4
department: retail.credit
event_type: loan.application.submitted
id: loan.retail.unsecured
inputs:
  example_payload:
    customer_id: C-88123
    requested_amount: 300000000
    term_m: 24
  fields:
  - customer_id
  - cccd
  - income_docs
  - requested_amount
  - term_m
  - consent_ref
  schema_ref: events/loan.application.v1.json
kpis:
- approval_rate
- default_30d
- tta_p50
- override_rate
outputs:
  decision: APPROVE|DECLINE|REVIEW
  limit_vnd: 300000000
  reasons:
  - dsti_ok
  - aml_clear
steps:
- id: s1-verify
  kind: workflow
  owner_role: system
  level: L4
  uses_rule:
  - KYC-01
  sla_minutes: 5
  on_fail: REVIEW
- id: s2-extract
  kind: ai
  owner_role: credit_officer
  level: L3
  uses_rule: []
  sla_minutes: 15
  on_fail: escalate:credit_officer
- id: s3-score
  kind: workflow
  owner_role: system
  level: L4
  uses_rule:
  - SBV-DSTI-04
  sla_minutes: 5
  on_fail: REVIEW
- id: s5-decide
  kind: human
  owner_role: credit_manager
  level: L3
  uses_rule:
  - CREDIT-GRID-11
  sla_minutes: 240
  uses_touchpoint: TP-E-inbox
  on_fail: escalate:risk
- id: s6-notify
  kind: workflow
  owner_role: system
  level: L4
  uses_touchpoint: TP-C-app-status
  sla_minutes: 5
  on_fail: retry+page
version: 2.0.0
