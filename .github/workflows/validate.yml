name: validate
on:
  pull_request:
  push:
    branches: [DEV, main]
jobs:
  metamodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml jsonschema yamllint
      - run: yamllint metamodel/ industries/
      - run: python scripts/validate.py
      - run: python scripts/validate.py --self-test
      - run: python scripts/audit_chain.py --demo
      - run: eval "$(python scripts/industrylib.py --demo-paths --shell)" && python scripts/migrate_check.py "$DEMO_FLOW" tests/fixtures/loan-approval.v1.4.0-minor.flow.yaml
      - run: eval "$(python scripts/industrylib.py --demo-paths --shell)" && python scripts/migrate_check.py "$DEMO_FLOW" tests/fixtures/loan-approval.v2.0.0-major.flow.yaml
      - run: python scripts/authz_check.py
      - run: python scripts/inbox_demo.py
      - run: cd /Users/thanhson/Workspace/abn.os.enterprise && python frappe/test_os_task.py
      - run: python scripts/eval_harness.py
      - run: python scripts/gen_goldens.py --seed 42 && git diff --exit-code -- industries/ && python scripts/eval_harness.py --strict
      - run: curl -sL https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz | tar xz && (python engine/load/stub.py 8099 &>/tmp/stub.log & echo $! > /tmp/stub.pid) && sleep 2 && ./k6-v0.53.0-linux-amd64/k6 run -e SMOKE=1 -e BASE_URL=http://127.0.0.1:8099 engine/load/loan-spike.js; code=$?; kill $(cat /tmp/stub.pid); exit $code
      - run: rm -rf /tmp/sbx-a /tmp/sbx-b && python scripts/gen_sandbox.py --seed 42 --scale small --out /tmp/sbx-a && python scripts/gen_sandbox.py --seed 42 --scale small --out /tmp/sbx-b && diff -r /tmp/sbx-a /tmp/sbx-b && sha256sum /tmp/sbx-a/*
      - run: eval "$(python scripts/industrylib.py --demo-paths --shell)" && python sim/sim.py --trace "$DEMO_TRACE" --instances 200 --seed 42 --out /tmp/sim-a.json && python sim/sim.py --trace "$DEMO_TRACE" --instances 200 --seed 42 --out /tmp/sim-b.json && diff /tmp/sim-a.json /tmp/sim-b.json
      - run: python scripts/export_bpmn.py && python scripts/export_bpmn.py --check
      - run: python scripts/pii_scan.py && python scripts/pii_scan.py --self-test
      - run: python scripts/rule_lint.py && python scripts/rule_lint.py --self-test
      - run: python bin/verify-industry-tags.py
      - run: python scripts/pack_lint.py && python scripts/pack_lint.py --self-test
      - run: python scripts/pack_cite_check.py && python scripts/pack_cite_check.py --self-test
      - run: python scripts/pack_claim_scan.py && python scripts/pack_claim_scan.py --self-test
      - run: python scripts/cross_industry.py && python scripts/cross_industry.py --self-test
      - run: python scripts/tier_guard.py && python scripts/tier_guard.py --self-test
      - run: python scripts/no_hardcoded_paths.py && python scripts/industrylib.py
      - run: python scripts/test_bundle.py
      - run: python scripts/dlq_drill.py
      - run: python scripts/money_drill.py --report /tmp/drill.json && python -c "import json;d=json.load(open('/tmp/drill.json'));assert d['double_posts']==0 and d['ledger_balanced']"
      - run: python scripts/chaos_exec.py
      - run: python scripts/render_explainer.py
      - run: python scripts/sod_mine.py
      - run: python scripts/pilot0_rehearsal.py
      - run: python scripts/promo_pack.py --out build/promo-pack.md; test $? -eq 1 && grep -q "approvals" build/promo-pack.md && echo "promo blocks on missing sign-off — OK"
      - run: python scripts/risk_pack.py --out build/risk-pack.md && grep -c "^## " build/risk-pack.md
      - run: eval "$(python scripts/industrylib.py --demo-paths --shell)" && python scripts/run_trace.py "$DEMO_FLOW" "$DEMO_EVENT" "$DEMO_TRACE"
      - run: python scripts/run_all_traces.py
      - run: rm -f /tmp/spike.journal && (python engine/spike/durable_runner.py --journal /tmp/spike.journal --crash-after 2; test $? -eq 2) && python engine/spike/durable_runner.py --journal /tmp/spike.journal --trace engine/spike/demo-trace.json
