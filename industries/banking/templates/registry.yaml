version: 1.1.0
templates:
  - id: app-received
    version: 1.1.0
    vi_diac: 'YCB ''{ref}'' đã tiếp nhận hồ sơ {product} của Quý khách. Mã theo dõi: {ref}.'
    sms_ascii: 'YCB ''{ref}'' da tiep nhan ho so {product} cua Quy khach. Ma theo doi: {ref}.'
    channels:
      - push
      - zalo
      - sms
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: app-approved
    version: 1.1.0
    vi_diac: 'Chúc mừng! Hồ sơ {ref} được duyệt hạn mức {limit} VND. Bấm để ký điện tử: {link}.'
    sms_ascii: 'Chuc mung! Ho so {ref} duoc duyet han muc {limit} VND. Bam de ky dien tu: {link}.'
    channels:
      - push
      - zalo
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: app-declined
    version: 1.1.0
    vi_diac: 'Hồ sơ {ref} chưa đủ điều kiện duyệt lần này. Lý do: {reason}. Quý khách có thể khiếu nại trong app.'
    sms_ascii: 'Ho so {ref} chua du dieu kien duyet lan nay. Ly do: {reason}. Quy khach co the khieu nai trong app.'
    channels:
      - push
      - zalo
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: app-need-info
    version: 1.1.0
    vi_diac: 'Hồ sơ {ref} cần bổ sung: {items}. Hạn bổ sung {deadline}.'
    sms_ascii: 'Ho so {ref} can bo sung: {items}. Han bo sung {deadline}.'
    channels:
      - push
      - zalo
      - sms
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: otp-sign
    version: 1.1.0
    vi_diac: 'Mã OTP ký tài liệu {ref} là {otp}, hiệu lực 5 phút. Không chia sẻ mã này.'
    sms_ascii: 'Ma OTP ky tai lieu {ref} la {otp}, hieu luc 5 phut. Khong chia se ma nay.'
    channels:
      - sms
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: disbursed
    version: 1.1.0
    vi_diac: 'Khoản vay {ref} đã giải ngân {amount} VND. Lịch trả nợ xem trong app.'
    sms_ascii: 'Khoan vay {ref} da giai ngan {amount} VND. Lich tra no xem trong app.'
    channels:
      - push
      - zalo
      - sms
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: transfer-done
    version: 1.1.0
    vi_diac: 'Giao dịch {amount} VND tới {payee_masked} thành công. Mã GD: {txn}.'
    sms_ascii: 'Giao dich {amount} VND toi {payee_masked} thanh cong. Ma GD: {txn}.'
    channels:
      - push
      - zalo
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: complaint-ack
    version: 1.1.0
    vi_diac: 'Khiếu nại {ticket} đã được tiếp nhận. Chúng tôi phản hồi trong {sla}.'
    sms_ascii: 'Khieu nai {ticket} da duoc tiep nhan. Chung toi phan hoi trong {sla}.'
    channels:
      - push
      - zalo
      - sms
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: complaint-resolved
    version: 1.1.0
    vi_diac: 'Khiếu nại {ticket} đã được giải quyết: {outcome}. Cảm ơn Quý khách.'
    sms_ascii: 'Khieu nai {ticket} da duoc giai quyet: {outcome}. Cam on Quy khach.'
    channels:
      - push
      - zalo
    consent: service-notice
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
  - id: promo-optin
    version: 1.1.0
    vi_diac: 'Ưu đãi {campaign} dành riêng cho Quý khách. Soạn TC để từ chối.'
    sms_ascii: 'Uu dai {campaign} danh rieng cho Quy khach. Soan TC de tu choi.'
    channels:
      - push
      - zalo
    consent: marketing-sms
    consent_check: 'pre-send receipt lookup (E47); suppress + log when absent'
